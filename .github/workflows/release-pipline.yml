# Workflow to build and release G4 Recorders (UIA, Chromium, SAP & Android) for production
name: Build & Release

# Define permissions for the workflow
permissions:
  contents: write
  checks: write
  pull-requests: write
  statuses: write

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# Set environment variables
env:
  artifactStagingDirectory: ${{ github.workspace }}/artifact_staging
  artifactType: 'Production'
  androidAppProjectName: G4.Recorders.Android.App
  androidProjectName: G4.Recorders.Android
  binariesDirectory: ${{ github.workspace }}/binaries
  buildConfiguration: 'Release'
  buildPlatform: 'any cpu'
  chromiumProjectName: G4.Recorders.Chromium
  sapProjectName: G4.Recorders.Sap
  uiaProjectName: G4.Recorders.Uia
  uiaPathFinderProjectName: G4.Recorders.Uia.PathFinder

# Default settings for all run steps
defaults:
  run:
    working-directory: src

# Define jobs for the workflow
jobs:
  # Job to get the version of the build
  new-version:
    name: New Version
    runs-on: windows-latest

    # Outputs of the job
    outputs:
      buildVersion: ${{ steps.parse-version.outputs.version }}
      validVersion: ${{ steps.validate-version.outputs.valid }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to parse the build version for GitHub tag
    - name: Parse Build Version for GitHub Tag
      id: parse-version
      shell: pwsh
      run: echo "version=$(Get-Date -UFormat '%Y.%m.%d').${{ github.run_number }}" >> $env:GITHUB_OUTPUT

    # Step to validate the parsed version
    - name: Validate Version ${{ steps.parse-version.outputs.version }}
      id: validate-version
      shell: pwsh
      run: |
        $version = "${{ steps.parse-version.outputs.version }}"
        echo "valid=$($version -match '^\d+(\.\d+){3}$')" >> $env:GITHUB_OUTPUT

  # Job to build and publish the G4 Recorders UIA host
  build-uia-recorder:
    name: Build & Publish G4 Recorders - UIA Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.uiaProjectName }}/${{ env.uiaProjectName }}.csproj

    # Add msbuild to PATH to ensure that MSBuild is available for the build and publish steps
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Step to set the G4 Recorders - UIA version
    - name: Set Version v${{ env.buildVersion }}
      shell: pwsh
      run: |
        $filePath          = "${{ env.uiaProjectName }}/Program.cs"
        $tempVersion       = '"0000.00.00.0000"'
        $version           = '"${{ env.buildVersion }}"'
        $content           = Get-Content -LiteralPath $filePath -Raw -ErrorAction Stop
        $placeholderCount  = ([regex]::Matches($content, [regex]::Escape($tempVersion))).Count

        if ($placeholderCount -ne 1) {
            throw "Expected exactly one version placeholder in '$filePath', but found $placeholderCount."
        }

        $newContent = $content.Replace($tempVersion, $version)
        Set-Content -LiteralPath $filePath -Value $newContent -NoNewline

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: msbuild ${{ env.uiaProjectName }}/${{ env.uiaProjectName }}.csproj /t:Publish /p:Configuration=Release /p:PublishDir=${{ env.binariesDirectory }}/${{ env.uiaProjectName }}/publish/

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        Compress-Archive `
            -Path ${{ env.binariesDirectory }}/${{ env.uiaProjectName }}/publish/* `
            -DestinationPath ${{ env.artifactStagingDirectory }}/uia-recorder.${{ env.buildVersion }}-win-x64.zip

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uia-recorder-drop
        path: ${{ env.artifactStagingDirectory }}/*.zip

  # Job to build and publish the G4 Recorders UIA PathFinder (XPath resolver)
  build-uia-path-finder:
    name: Build & Publish G4 Recorders - UIA PathFinder Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.uiaPathFinderProjectName }}/${{ env.uiaPathFinderProjectName }}.csproj

    # Add msbuild to PATH (required for the WPF + COMReference PathFinder project)
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: msbuild ${{ env.uiaPathFinderProjectName }}/${{ env.uiaPathFinderProjectName }}.csproj /t:Publish /p:Configuration=Release /p:PublishDir=${{ env.binariesDirectory }}/${{ env.uiaPathFinderProjectName }}/publish/

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        Compress-Archive `
            -Path ${{ env.binariesDirectory }}/${{ env.uiaPathFinderProjectName }}/publish/* `
            -DestinationPath ${{ env.artifactStagingDirectory }}/uia-path-finder.${{ env.buildVersion }}-win-x64.zip

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uia-path-finder-drop
        path: ${{ env.artifactStagingDirectory }}/*.zip

  # Job to build and publish the G4 Recorders SAP host
  build-sap-recorder:
    name: Build & Publish G4 Recorders - SAP Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to set the G4 Recorders - SAP version
    - name: Set Version v${{ env.buildVersion }}
      shell: pwsh
      run: |
        $filePath          = "${{ env.sapProjectName }}/Program.cs"
        $tempVersion       = '"0000.00.00.0000"'
        $version           = '"${{ env.buildVersion }}"'
        $content           = Get-Content -LiteralPath $filePath -Raw -ErrorAction Stop
        $placeholderCount  = ([regex]::Matches($content, [regex]::Escape($tempVersion))).Count

        if ($placeholderCount -ne 1) {
            throw "Expected exactly one version placeholder in '$filePath', but found $placeholderCount."
        }

        $newContent = $content.Replace($tempVersion, $version)
        Set-Content -LiteralPath $filePath -Value $newContent -NoNewline

    # Step to publish the project; SAP GUI Scripting is late-bound, so the dotnet CLI builds it without COM references
    - name: Publish
      shell: pwsh
      run: dotnet publish ${{ env.sapProjectName }}/${{ env.sapProjectName }}.csproj -c Release -o ${{ env.binariesDirectory }}/${{ env.sapProjectName }}/publish/

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        Compress-Archive `
            -Path ${{ env.binariesDirectory }}/${{ env.sapProjectName }}/publish/* `
            -DestinationPath ${{ env.artifactStagingDirectory }}/sap-recorder.${{ env.buildVersion }}-win-x64.zip

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sap-recorder-drop
        path: ${{ env.artifactStagingDirectory }}/*.zip

  # Job to build and publish the G4 Recorders Chromium host
  build-chromium-recorder:
    name: Build & Publish G4 Recorders - Chromium ${{ matrix.runtime }} Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: ${{ matrix.runner }}
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
            archiveExtension: zip
            artifactName: chromium-recorder-win-drop
          - runner: ubuntu-latest
            runtime: linux-x64
            archiveExtension: tar.gz
            artifactName: chromium-recorder-linux-drop
          # macOS drops for Intel and Apple Silicon. The recorder is framework-dependent (no native
          # compilation), so the Apple Silicon runner publishes both runtime identifiers.
          - runner: macos-latest
            runtime: osx-x64
            archiveExtension: tar.gz
            artifactName: chromium-recorder-osx-x64-drop
          - runner: macos-latest
            runtime: osx-arm64
            archiveExtension: tar.gz
            artifactName: chromium-recorder-osx-arm64-drop

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.chromiumProjectName }}/${{ env.chromiumProjectName }}.csproj

    # Step to set the G4 Recorders - Chromium version
    - name: Set Version v${{ env.buildVersion }}
      shell: pwsh
      run: |
        $filePath          = "${{ env.chromiumProjectName }}/Program.cs"
        $tempVersion       = '"0000.00.00.0000"'
        $version           = '"${{ env.buildVersion }}"'
        $content           = Get-Content -LiteralPath $filePath -Raw -ErrorAction Stop
        $placeholderCount  = ([regex]::Matches($content, [regex]::Escape($tempVersion))).Count

        if ($placeholderCount -ne 1) {
            throw "Expected exactly one version placeholder in '$filePath', but found $placeholderCount."
        }

        $newContent = $content.Replace($tempVersion, $version)
        Set-Content -LiteralPath $filePath -Value $newContent -NoNewline

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: >-
        dotnet publish
        ${{ env.chromiumProjectName }}/${{ env.chromiumProjectName }}.csproj
        --configuration ${{ env.buildConfiguration }}
        --runtime ${{ matrix.runtime }}
        --self-contained false
        --output ${{ env.binariesDirectory }}/${{ env.chromiumProjectName }}/publish

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        $archivePath = "${{ env.artifactStagingDirectory }}/chromium-recorder.${{ env.buildVersion }}-${{ matrix.runtime }}.${{ matrix.archiveExtension }}"

        if ("${{ matrix.archiveExtension }}" -eq "zip") {
          Compress-Archive `
              -Path ${{ env.binariesDirectory }}/${{ env.chromiumProjectName }}/publish/* `
              -DestinationPath $archivePath
        }
        else {
          tar -czf $archivePath -C ${{ env.binariesDirectory }}/${{ env.chromiumProjectName }}/publish .

          if ($LASTEXITCODE -ne 0) {
            throw "tar failed with exit code $LASTEXITCODE."
          }
        }

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifactName }}
        path: ${{ env.artifactStagingDirectory }}/*

  # Job to build the Android recorder app (the APK the Android recorder host installs on devices)
  build-android-app:
    name: Build G4 Recorders - Android App Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: ubuntu-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to setup the JDK the Gradle build targets
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    # Step to setup the Android SDK (platform and build tools are installed by the Android Gradle plugin)
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Step to run the app's unit tests and build the release APK, which the build exports to
    # src/G4.Recorders.Android.App.Drop/g4-recorder.apk
    - name: Test & Build APK
      working-directory: src/${{ env.androidAppProjectName }}
      shell: bash
      run: |
        chmod +x ./gradlew
        ./gradlew test assembleRelease --no-daemon

    # Step to upload the APK for the host publish jobs
    - name: Upload the APK
      uses: actions/upload-artifact@v4
      with:
        name: android-recorder-app-drop
        path: src/${{ env.androidAppProjectName }}.Drop/g4-recorder.apk
        if-no-files-found: error

  # Job to build and publish the G4 Recorders Android host, with the APK inside, for every desktop platform
  build-android-recorder:
    name: Build & Publish G4 Recorders - Android ${{ matrix.runtime }} Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: ${{ matrix.runner }}
    needs:
      - new-version
      - build-android-app
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
            archiveExtension: zip
            artifactName: android-recorder-win-drop
          - runner: ubuntu-latest
            runtime: linux-x64
            archiveExtension: tar.gz
            artifactName: android-recorder-linux-drop
          # The host is framework-dependent, so the Apple Silicon runner publishes both macOS runtime identifiers.
          - runner: macos-latest
            runtime: osx-x64
            archiveExtension: tar.gz
            artifactName: android-recorder-osx-x64-drop
          - runner: macos-latest
            runtime: osx-arm64
            archiveExtension: tar.gz
            artifactName: android-recorder-osx-arm64-drop

    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to put the freshly built APK into the drop folder the host project links, replacing any committed copy
    - name: Download the APK
      uses: actions/download-artifact@v4
      with:
        name: android-recorder-app-drop
        path: ${{ github.workspace }}/src/${{ env.androidAppProjectName }}.Drop

    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.androidProjectName }}/${{ env.androidProjectName }}.csproj

    # Step to set the G4 Recorders - Android version
    - name: Set Version v${{ env.buildVersion }}
      shell: pwsh
      run: |
        $filePath          = "${{ env.androidProjectName }}/Program.cs"
        $tempVersion       = '"0000.00.00.0000"'
        $version           = '"${{ env.buildVersion }}"'
        $content           = Get-Content -LiteralPath $filePath -Raw -ErrorAction Stop
        $placeholderCount  = ([regex]::Matches($content, [regex]::Escape($tempVersion))).Count

        if ($placeholderCount -ne 1) {
            throw "Expected exactly one version placeholder in '$filePath', but found $placeholderCount."
        }

        $newContent = $content.Replace($tempVersion, $version)
        Set-Content -LiteralPath $filePath -Value $newContent -NoNewline

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: >-
        dotnet publish
        ${{ env.androidProjectName }}/${{ env.androidProjectName }}.csproj
        --configuration ${{ env.buildConfiguration }}
        --runtime ${{ matrix.runtime }}
        --self-contained false
        --output ${{ env.binariesDirectory }}/${{ env.androidProjectName }}/publish

    # Step to fail the build when the APK did not make it into the published host
    - name: Verify the APK is Published
      shell: pwsh
      run: |
        $apkPath = "${{ env.binariesDirectory }}/${{ env.androidProjectName }}/publish/${{ env.androidAppProjectName }}.Drop/g4-recorder.apk"

        if (-not (Test-Path -LiteralPath $apkPath)) {
            throw "The recorder APK is missing from the published host: $apkPath"
        }

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        $archivePath = "${{ env.artifactStagingDirectory }}/android-recorder.${{ env.buildVersion }}-${{ matrix.runtime }}.${{ matrix.archiveExtension }}"

        if ("${{ matrix.archiveExtension }}" -eq "zip") {
          Compress-Archive `
              -Path ${{ env.binariesDirectory }}/${{ env.androidProjectName }}/publish/* `
              -DestinationPath $archivePath
        }
        else {
          tar -czf $archivePath -C ${{ env.binariesDirectory }}/${{ env.androidProjectName }}/publish .

          if ($LASTEXITCODE -ne 0) {
            throw "tar failed with exit code $LASTEXITCODE."
          }
        }

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifactName }}
        path: ${{ env.artifactStagingDirectory }}/*

  # Job to create a GitHub release and tag the new version
  create-release:
    name: New GitHub Release Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs:
      - new-version
      - build-uia-recorder
      - build-uia-path-finder
      - build-chromium-recorder
      - build-sap-recorder
      - build-android-recorder
    if: success()

    # Set environment variables specific to the release job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to download G4 Recorders - UIA build artifacts
    - name: Download G4 Recorders - UIA Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: uia-recorder-drop

    # Step to download G4 Recorders - UIA PathFinder build artifacts
    - name: Download G4 Recorders - UIA PathFinder Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: uia-path-finder-drop

    # Step to download G4 Recorders - Chromium build artifacts
    - name: Download G4 Recorders - Chromium Windows Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: chromium-recorder-win-drop

    - name: Download G4 Recorders - Chromium Linux Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: chromium-recorder-linux-drop

    - name: Download G4 Recorders - Chromium macOS Intel Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: chromium-recorder-osx-x64-drop

    - name: Download G4 Recorders - Chromium macOS Apple Silicon Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: chromium-recorder-osx-arm64-drop

    # Step to download G4 Recorders - SAP build artifacts
    - name: Download G4 Recorders - SAP Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: sap-recorder-drop

    # Step to download G4 Recorders - Android build artifacts
    - name: Download G4 Recorders - Android Windows Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-recorder-win-drop

    - name: Download G4 Recorders - Android Linux Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-recorder-linux-drop

    - name: Download G4 Recorders - Android macOS Intel Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-recorder-osx-x64-drop

    - name: Download G4 Recorders - Android macOS Apple Silicon Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-recorder-osx-arm64-drop

    # Step to create a GitHub release and tag
    - name: Create GitHub Release & Tag v${{ env.buildVersion }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./*.zip
          ./*.tar.gz
        tag_name: v${{ env.buildVersion }}
        name: ${{ env.artifactType }} v${{ env.buildVersion }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
