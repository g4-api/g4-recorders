# Workflow to build and release G4 Recorders (UIA & Chromium) for production
name: Build & Release

# Define permissions for the workflow
permissions:
  contents: write
  checks: write
  pull-requests: write
  statuses: write

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# Set environment variables
env:
  artifactStagingDirectory: ${{ github.workspace }}/artifact_staging
  artifactType: 'Production'
  binariesDirectory: ${{ github.workspace }}/binaries
  buildConfiguration: 'Release'
  buildPlatform: 'any cpu'
  chromiumProjectName: G4.Recorders.Chromium
  uiaProjectName: G4.Recorders.Uia

# Default settings for all run steps
defaults:
  run:
    working-directory: src

# Define jobs for the workflow
jobs:
  # Job to get the version of the build
  new-version:
    name: New Version
    runs-on: windows-latest

    # Outputs of the job
    outputs:
      buildVersion: ${{ steps.parse-version.outputs.version }}
      validVersion: ${{ steps.validate-version.outputs.valid }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to parse the build version for GitHub tag
    - name: Parse Build Version for GitHub Tag
      id: parse-version
      shell: pwsh
      run: echo "version=$(Get-Date -UFormat '%Y.%m.%d').${{ github.run_number }}" >> $env:GITHUB_OUTPUT

    # Step to validate the parsed version
    - name: Validate Version ${{ steps.parse-version.outputs.version }}
      id: validate-version
      shell: pwsh
      run: |
        $version = "${{ steps.parse-version.outputs.version }}"
        echo "valid=$($version -match '^\d+(\.\d+){3}$')" >> $env:GITHUB_OUTPUT

  # Job to build and publish the G4 Recorders UIA host
  build-uia-recorder:
    name: Build & Publish G4 Recorders - UIA Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.uiaProjectName }}/${{ env.uiaProjectName }}.csproj

    # Add msbuild to PATH to ensure that MSBuild is available for the build and publish steps
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Step to set the G4 Recorders - UIA version
    - name: Set Version v${{ env.buildVersion }}
      shell: pwsh
      run: |
        $filePath          = "${{ env.uiaProjectName }}/Program.cs"
        $tempVersion       = '"0000.00.00.0000"'
        $version           = '"${{ env.buildVersion }}"'
        $content           = Get-Content -LiteralPath $filePath -Raw -ErrorAction Stop
        $placeholderCount  = ([regex]::Matches($content, [regex]::Escape($tempVersion))).Count

        if ($placeholderCount -ne 1) {
            throw "Expected exactly one version placeholder in '$filePath', but found $placeholderCount."
        }

        $newContent = $content.Replace($tempVersion, $version)
        Set-Content -LiteralPath $filePath -Value $newContent -NoNewline

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: msbuild ${{ env.uiaProjectName }}/${{ env.uiaProjectName }}.csproj /t:Publish /p:Configuration=Release /p:PublishDir=${{ env.binariesDirectory }}/${{ env.uiaProjectName }}/publish/

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        Compress-Archive `
            -Path ${{ env.binariesDirectory }}/${{ env.uiaProjectName }}/publish/* `
            -DestinationPath ${{ env.artifactStagingDirectory }}/uia-recorder.${{ env.buildVersion }}-win-x64.zip

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uia-recorder-drop
        path: ${{ env.artifactStagingDirectory }}/*.zip

  # Job to build and publish the G4 Recorders Chromium host
  build-chromium-recorder:
    name: Build & Publish G4 Recorders - Chromium Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs: new-version
    if: ${{ needs.new-version.result == 'success' && needs.new-version.outputs.validVersion == 'True' }}

    # Outputs of the job
    outputs:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    # Set environment variables specific to the build job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to setup .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    # Step to restore packages
    - name: Restore Packages
      shell: pwsh
      run: dotnet restore ${{ env.chromiumProjectName }}/${{ env.chromiumProjectName }}.csproj

    # Step to set the G4 Recorders - Chromium version
    - name: Set Version v${{ env.buildVersion }}
      shell: pwsh
      run: |
        $filePath          = "${{ env.chromiumProjectName }}/Program.cs"
        $tempVersion       = '"0000.00.00.0000"'
        $version           = '"${{ env.buildVersion }}"'
        $content           = Get-Content -LiteralPath $filePath -Raw -ErrorAction Stop
        $placeholderCount  = ([regex]::Matches($content, [regex]::Escape($tempVersion))).Count

        if ($placeholderCount -ne 1) {
            throw "Expected exactly one version placeholder in '$filePath', but found $placeholderCount."
        }

        $newContent = $content.Replace($tempVersion, $version)
        Set-Content -LiteralPath $filePath -Value $newContent -NoNewline

    # Step to publish the project
    - name: Publish
      shell: pwsh
      run: dotnet publish ${{ env.chromiumProjectName }}/${{ env.chromiumProjectName }}.csproj --configuration ${{ env.buildConfiguration }} --output ${{ env.binariesDirectory }}/${{ env.chromiumProjectName }}/publish

    # Step to create a build artifact
    - name: Create Build Artifact
      shell: pwsh
      run: |
        New-Item -Path "${{ env.artifactStagingDirectory }}" -ItemType Directory
        Compress-Archive `
            -Path ${{ env.binariesDirectory }}/${{ env.chromiumProjectName }}/publish/* `
            -DestinationPath ${{ env.artifactStagingDirectory }}/chromium-recorder.${{ env.buildVersion }}-x64.zip

    # Step to upload the build artifact
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chromium-recorder-drop
        path: ${{ env.artifactStagingDirectory }}/*.zip

  # Job to create a GitHub release and tag the new version
  create-release:
    name: New GitHub Release Version ${{ needs.new-version.outputs.buildVersion }}
    runs-on: windows-latest
    needs:
      - new-version
      - build-uia-recorder
      - build-chromium-recorder
    if: success()

    # Set environment variables specific to the release job
    env:
      buildVersion: ${{ needs.new-version.outputs.buildVersion }}

    steps:
    # Step to checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step to download G4 Recorders - UIA build artifacts
    - name: Download G4 Recorders - UIA Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: uia-recorder-drop

    # Step to download G4 Recorders - Chromium build artifacts
    - name: Download G4 Recorders - Chromium Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: chromium-recorder-drop

    # Step to create a GitHub release and tag
    - name: Create GitHub Release & Tag v${{ env.buildVersion }}
      uses: softprops/action-gh-release@v2
      with:
        files: ./*.zip
        tag_name: v${{ env.buildVersion }}
        name: ${{ env.artifactType }} v${{ env.buildVersion }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
